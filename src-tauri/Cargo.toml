[package]
name = "pinefetch"
version = "2.5.2"
description = "Local yt-dlp desktop UI"
authors = ["Oliver Jessner"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
regex = "1"
base64 = "0.22"
getrandom = "0.2"
rusqlite = { version = "0.31", features = ["bundled", "backup", "functions"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.12"
# Keep the Dock menu on Tauri's muda version so menu events share one dispatcher.
muda = { version = "=0.21.2", default-features = false }
objc2 = "=0.6.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Backport RUSTSEC-2024-0429 while Tauri's GTK3 stack requires glib 0.18.
# See vendor/README.md for the upstream source and removal criteria.
[patch.crates-io]
glib = { path = "vendor/glib" }

# Full-video SHA checks must remain fast while the app itself stays debuggable.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
